<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>주제에 맞는 이미지 고르기</title>
</head>
<style>
    .gridContainer{
        display: grid;
        grid-template-columns: repeat(3,1fr);
        gap: 10px;
        max-width: 450px;
        margin: 20px 0;
    }
    .gridBox{
        aspect-ratio: 1;
        border: 3px solid #969696;
        cursor: pointer;
        overflow: hidden;
    }
    .gridBox img{
        width: 100%;
        height: 100%;
        object-fit: cover;
    }
    .gridBox.selected{
        border-color: #ff0000;
    }
</style>
<body>
    <h2>"<span id = "prompt"></span>"를 선택하고 확인을 누르세요.</h2>
    <div id = "grid" class="gridContainer"></div>
    <button onclick="ClickButton()">확인</button>
    <script>
        const imagePrompt = {
            "어류": ["복어", "상어", "참치", "가오리", "흰동가리"],
            "조류": ["오리", "닭", "수리", "비둘기", "백조"],
            "포유류": ["개", "고양이", "사자", "호랑이", "코끼리"],
            "양서류": ["개구리", "개구리2", "두꺼비", "도롱뇽", "도롱뇽2"],
            "파충류": ["카멜레온", "악어", "도마뱀", "뱀", "거북이"]
        };
        let randomPrompt = "";
        let selectedImage = [];
        let chosenImage = [];

        function gameStart(){
            selectedImage = [];
            const prompts = Object.keys(imagePrompt);
            randomPrompt = prompts[Math.floor(Math.random() * prompts.length)];
            document.getElementById("prompt").innerText = randomPrompt;

            let images = [];
            prompts.forEach((A) => {
                imagePrompt[A].forEach((B) => {
                    images.push({category: A, name: B});
                });
            });
              
            while(1){
                images.sort(() => Math.random() - 0.5);
                chosenImage = images.slice(0,9);

                const hasCorrectImage = chosenImage.some((img) => img.category === randomPrompt);

                if(hasCorrectImage) break;
            }

            const gridContainer = document. getElementById("grid");
            gridContainer.innerHTML = "";

            chosenImage.forEach((A) => {
                const div = document.createElement("div");
                div.className = "gridBox";
                div.innerHTML = `<img src = "images/${A.category}/${A.name}.jpg">`;
                div.onclick = (() =>{
                    const index = selectedImage.indexOf(A);
                    if(index > -1){
                        selectedImage.splice(index, 1);
                        div.classList.remove("selected");
                    }
                    else{
                        selectedImage.push(A);
                        div.classList.add("selected");
                    }
                });
                gridContainer.appendChild(div);
            });
        }

        function ClickButton(){
            if (selectedImage.length === 0){
                alert("이미지를 선택하세요.");
                return;
            }

            const countAnswer = chosenImage.filter((img) => img.category === randomPrompt).length;
            const countMyAnswer = selectedImage.filter((img) => img.category === randomPrompt).length;
            
            if (selectedImage.length === countAnswer && countMyAnswer === countAnswer){
                alert("정답입니다.");
                gameStart();
            }
            else{
                alert("다시 시도해보세요.");
                selectedImage = [];
                document.querySelectorAll(".gridBox").forEach((B) =>
            B.classList.remove("selected"));
            }
        }
        window.onload = gameStart;
    </script>
</body>
</html>
